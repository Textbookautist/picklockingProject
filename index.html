<!DOCTYPE html>
<html>

<head>
    <title>Pick a Lock</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div>
        <h1>Pick a Lock</h1>
    </div>

    <div id="topControls">
        <button id="newLockBtn" class="controlBtn">New Lock</button>
        <button id="statisticsBtn" class="controlBtn">Statistics</button>
        <button id="customBtn" class="controlBtn">Customization</button>
    </div>

    <div id="flexibleContainer"></div>

    <div id="pickContainer"></div>

    <div id="lockContainer">
        <div id="lockClock"></div>
    </div>

    <script src="components/LockPick.js"></script> <!-- Gets the class for lockpicks -->
    <script src="components/LockPin.js"></script> <!-- Gets the class for the pins of a lock -->
    <script src="components/Lock.js"></script> <!-- Gets the class for the lock itself -->
    <script src="subscripts/customization.js"></script> <!-- Handles customization options -->
    <script src="main.js"></script> <!-- Generates lockpicks, contains lock generation and so on. -->
    <script src="subscripts/statisticScript.js"></script>


</body>

</html>
