<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="topControls">
        <button id="newLockBtn" class="controlBtn">New Lock</button>
        <button id="statisticsBtn" class="controlBtn">Statistics</button>
    </div>
    <div id="lockContainer"></div> <!-- Lock is inserted here-->


    <script>

        const newLockBtn = document.getElementById("newLockBtn");
        newLockBtn.addEventListener("click", newLock);
        const statisticsBtn = document.getElementById("statisticsBtn");
        statisticsBtn.addEventListener("click", showStatistics);
        const lockContainer = document.getElementById("lockContainer");

        let lock = null;
        let currentPressure = 0;

        class lockPin {
            parentLock = null;
            position = 0;
            unlocked = false;
            pressureTreshold = 0;
            appliedPressure = 0;
            selected = false;
            pinButton = null;
            constructor(pos, difficultyRating, parent) {
                this.position = pos;
                this.pressureTreshold = Math.ceil(Math.random() * (difficultyRating + 1) * 10);
                this.parentLock = parent;
                console.log(`Created Pin at position ${this.position} with pressure treshold ${this.pressureTreshold} and parent lock difficulty ${this.parentLock.difficulty}`);
            }
            addBtn(btn) {
                this.pinButton = btn;
            }
            displayInfo() {
                console.log(`     Pin Position: ${this.position}, Pressure Treshold: ${this.pressureTreshold}`);

            }
            toggleSelect() {
                this.selected = !this.selected;
                if (this.selected) {
                    this.pinButton.style.backgroundColor = "red";
                    this.parentLock.pins.forEach(pin => {
                        if (pin !== this && pin.selected) {
                            pin.toggleSelect();
                        }
                    });
                }
                else {
                    this.pinButton.style.backgroundColor = "#4CAF50";
                }
            }
            applyPressure(currentPressure) {
                this.appliedPressure += currentPressure
                if (this.appliedPressure > this.pressureTreshold) {
                    parentLock.reset();
                }
                else if (this.appliedPressure === this.pressureTreshold) {
                    this.unlocked = true;
                    console.log(`Pin ${this.position} unlocked!`);
                    parentLock.signalPinUnlocked(this);
                }
            }
        }
        class Lock {
            timeSpent = 0;
            difficulty = 0;
            pinNumber = 0;
            pins = [];
            screen = null
            constructor(difficulty, pinNumber) {
                this.timeSpent = 0;
                this.difficulty = difficulty;
                this.pinNumber = pinNumber;
                for (let i = 0; i < pinNumber; i++) {
                    this.pins.push(new lockPin(i, difficulty, this));
                }
            }
            displayInfo() {
                console.log(`Lock Difficulty: ${this.difficulty}, Number of Pins: ${this.pinNumber}`);
                this.pins.forEach(pin => pin.displayInfo());
            }
            signalPinUnlocked(sourcePin) {
                console.log(`Lock received unlock signal from Pin ${sourcePin.position}`);
                let allUnlocked = this.pins.every(pin => pin.unlocked);
                if (allUnlocked) {
                    console.log("Lock fully unlocked!");
                    unlockedamount++;
                }
            }
            startCounting() {
                this.timeSpent = 0;
                setInterval(() => {
                    this.timeSpent++;
                }, 1000);
            }
            addScreen(screenElement) {
                this.screen = screenElement;
            }
        }

        function newLock() {
            console.log("New Lock Created"); // Placeholder functionality
            lock = new Lock(3, 5); // Example: difficulty 3, 5 pins
            lock.startCounting();
            lock.displayInfo();

            let lockbase = document.createElement("div");
            lockbase.className = "lockBase";
            lockContainer.innerHTML = ""; // Clear previous lock);
            lockContainer.appendChild(lockbase);

            let pinrow = document.createElement("div");
            pinrow.className = "pinRow";
            lockbase.appendChild(pinrow);
            for (let [index, pin] of lock.pins.entries()) {
                let pinBtn = document.createElement("button");
                pinBtn.className = "circularBtn";
                pinBtn.innerText = `Pin ${pin.position}`;
                pinBtn.addEventListener("click", () => {
                    pin.toggleSelect();
                    console.log(`Pin ${pin.position} selected: ${pin.selected}`);
                });
                pin.addBtn(pinBtn);
                pinrow.appendChild(pinBtn);
            }
            let br = document.createElement("br");
            lockbase.appendChild(br);

            let lockScreen = document.createElement("div");
            lockScreen.className = "lockScreen";
            lockbase.appendChild(lockScreen);
            lock.addScreen = lockScreen;
        }

        function showStatistics() {
            console.log("Showing Statistics"); // Placeholder functionality
        }

    </script>
</body>

</html>
