<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="topControls">
        <button id="newLockBtn" class="controlBtn">New Lock</button> <!-- Creates a new lock into the lockContainer-->
        <button id="statisticsBtn" class="controlBtn">Statistics</button>
        <!-- Only a placeholder functionality at the moment -->
        <button id="customBtn" class="controlBtn">Customization</button> <!-- Will allow for gameplay customization -->
    </div>
    <div id="flexibleContainer"> <!-- Holds utility stuff like customization options-->

    </div>
    <div id="pickContainer"></div> <!-- Picks are inserted here -->
    <div id="lockContainer"></div> <!-- Lock is inserted here -->


    <script src="components/LockPick.js"></script> <!-- Gets the class for lockpicks -->
    <script src="components/LockPin.js"></script> <!-- Gets the class for the pins of a lock -->
    <script src="components/Lock.js"></script> <!-- Gets the class for the lock itself -->
    <script src="main.js"></script> <!-- Generates lockpicks, contains lock generation and so on. -->
    <script src="subscripts/statisticScript.js"></script>
    <script src="subscripts/customization.js"></script>

</body>

</html>
