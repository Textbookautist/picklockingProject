<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="topControls">
        <button id="newLockBtn" class="controlBtn">New Lock</button>
        <button id="statisticsBtn" class="controlBtn">Statistics</button>
    </div>
    <div id="pickContainer"></div>
    <div id="lockContainer"></div> <!-- Lock is inserted here-->


    <script>

        let picksAvailable = 0;
        let picksPouch = [];

        const newLockBtn = document.getElementById("newLockBtn");
        newLockBtn.addEventListener("click", newLock);
        const statisticsBtn = document.getElementById("statisticsBtn");
        statisticsBtn.addEventListener("click", showStatistics);

        const pickContainer = document.getElementById("pickContainer"); //holds available picks

        const lockContainer = document.getElementById("lockContainer"); // holds the lock

        let lock = null;
        let currentPressure = 0;
        let currentPick = null

        class lockPin {
            parentLock = null;
            position = 0;
            unlocked = false;
            pressureTreshold = 0;
            appliedPressure = 0;
            selected = false;
            pinButton = null;
            constructor(pos, difficultyRating, parent) { // makes a pressure treshold based on difficulty, minimum of 21
                this.position = pos;
                this.pressureTreshold = Math.floor(Math.random() * (difficultyRating * 10)) + 21;
                this.parentLock = parent;
                console.log(`Created Pin at position ${this.position} with pressure treshold ${this.pressureTreshold} and parent lock difficulty ${this.parentLock.difficulty}`);
            }
            addBtn(btn) {
                this.pinButton = btn;
            }
            displayInfo() {
                console.log(`     Pin Position: ${this.position}, Pressure Treshold: ${this.pressureTreshold}`);

            }
            toggleSelect() {
                this.selected = !this.selected;
                if (this.selected) {
                    this.parentLock.updatePinInformation(`${this.pressureTreshold} / ${this.appliedPressure}`);
                    this.pinButton.style.backgroundColor = "red";
                    this.parentLock.pins.forEach(pin => {
                        if (pin !== this && pin.selected) {
                            pin.toggleSelect();
                        }
                    });
                }
                else {
                    this.pinButton.style.backgroundColor = "#4CAF50";
                    if (this.pressureTreshold !== this.appliedPressure) {
                        this.parentLock.reset()
                    }
                }
            }
            applyPressure(currentPressure) {
                this.appliedPressure += currentPressure
                if (this.appliedPressure > this.pressureTreshold) {
                    parentLock.reset();
                }
                else if (this.appliedPressure === this.pressureTreshold) {
                    this.unlocked = true;
                    console.log(`Pin ${this.position} unlocked!`);
                    this.selected = false;
                    this.pinButton.style.backgroundColor = "gray";
                    parentLock.signalPinUnlocked(this);
                }
                this.parentLock.updatePinInformation(`${this.pressureTreshold} / ${this.appliedPressure}`);
            }
        }
        class Lock {
            timeSpent = 0;
            difficulty = 0;
            pinNumber = 0;
            pins = []; // array of lockPin objects
            clock = null // element to show clock
            screen = null // element to show lock screen
            pinInfo = null // element to show pin information
            constructor(difficulty, pinNumber) {
                this.timeSpent = 0;
                this.difficulty = difficulty;
                this.pinNumber = pinNumber;
                for (let i = 0; i < pinNumber; i++) {
                    this.pins.push(new lockPin(i, difficulty, this));
                }
            }
            displayInfo() {
                console.log(`Lock Difficulty: ${this.difficulty}, Number of Pins: ${this.pinNumber}`);
                this.pins.forEach(pin => pin.displayInfo());
            }
            signalPinUnlocked(sourcePin) {
                console.log(`Lock received unlock signal from Pin ${sourcePin.position}`);
                let allUnlocked = this.pins.every(pin => pin.unlocked);
                if (allUnlocked) {
                    console.log("Lock fully unlocked!");
                    unlockedamount++;
                }
            }
            startCounting() {
                this.timeSpent = 0
                setInterval(() => {
                    this.timeSpent += 1000;
                    let seconds = this.timeSpent / 1000;
                    let minutes = 0
                    if (seconds > 60) {
                        while (seconds > 60) {
                            seconds -= 60;
                            minutes += 1;
                        }
                    }

                    if (minutes == 0) { this.clock.innerText = `Time Spent: ${seconds} seconds`; }
                    else { this.clock.innerText = `Time Spent: ${minutes} minutes and ${seconds} seconds`; }

                }, 1000);
            }
            applyPressureToSelectedPin(pressure) {
                let selectedPin = this.pins.find(pin => pin.selected);
                if (selectedPin) {
                    selectedPin.applyPressure(pressure);
                }
            }
            addScreen(screenElement) {
                this.screen = screenElement;
            }
            addClock(clockElement) {
                this.clock = clockElement;
            }
            addPinInformation(pinInfoElement) {
                this.pinInfo = pinInfoElement;
            }
            updatePinInformation(info) {
                this.pinInfo.innerText = info;
            }
            reset() { // can reset due to overpressure, or changing a pin while it has pressure applied to it
                console.log("Lock resetting due to overpressure or pin change.");
                this.pins.forEach(pin => {
                    pin.appliedPressure = 0;
                    pin.unlocked = false;
                    if (pin.pinButton) {
                        pin.pinButton.style.backgroundColor = "#4CAF50";
                    }
                });
                this.updatePinInformation("Lock Reset. All pins set to 0 pressure.");
            }
        }
        class lockPick {
            strength = 0;
            selected = false;
            pickButton = null;
            constructor(strength) {
                this.strength = strength;
            }
            toggleSelect() {
                this.selected = !this.selected;
                if (this.selected) {
                    if (currentPick != null) {
                        currentPick.toggleSelect();
                    }
                    console.log(`Pick of strength ${this.strength} selected.`);
                    currentPressure = this.strength;
                    currentPick = this;
                    this.pickButton.style.backgroundColor = "lightblue";
                }
                else {
                    console.log(`Pick of strength ${this.strength} deselected.`);
                    currentPressure = 0;
                    currentPick = null;
                    this.pickButton.style.backgroundColor = "black"

                }
            }
        }


        function newLock() {
            console.log("New Lock Created"); // Placeholder functionality
            lock = new Lock(3, 5); // Example: difficulty 3, 5 pins
            lock.displayInfo();

            let lockbase = document.createElement("div");
            lockbase.className = "lockBase";
            lockContainer.innerHTML = ""; // Clear previous lock);
            lockContainer.appendChild(lockbase);

            let pinrow = document.createElement("div");
            pinrow.className = "pinRow";
            lockbase.appendChild(pinrow);
            for (let [index, pin] of lock.pins.entries()) {
                let pinBtn = document.createElement("button");
                pinBtn.className = "circularBtn";
                pinBtn.innerText = `Pin ${pin.position}`;
                pinBtn.addEventListener("click", () => {
                    pin.toggleSelect();
                    console.log(`Pin ${pin.position} selected: ${pin.selected}`);
                });
                pin.addBtn(pinBtn);
                pinrow.appendChild(pinBtn);
            }

            let lockScreen = document.createElement("div");
            lockScreen.className = "lockScreen";
            lockbase.appendChild(lockScreen);
            lock.addScreen = lockScreen;

            let lockclock = document.createElement("p"); //keeps time the lock tracks with startCounting()
            lock.addClock(lockclock);
            lockclock.className = "lockClock";
            let quickdiv = document.createElement("div");
            quickdiv.style.position = "absolute";
            quickdiv.style.top = "10px";
            quickdiv.style.right = "10px";
            lockScreen.appendChild(quickdiv);
            quickdiv.appendChild(lockclock);
            lock.startCounting();

            let quickdiv2 = document.createElement("div");
            quickdiv2.style.position = "absolute";
            quickdiv2.style.bottom = "10px";
            quickdiv2.style.left = "10px";
            lockScreen.appendChild(quickdiv2);
            let pinInformation = document.createElement("p");
            lock.addPinInformation(pinInformation);
            quickdiv2.appendChild(pinInformation);
        }

        function showStatistics() {
            console.log("Showing Statistics"); // Placeholder functionality
        }

        function makePicks() {
            let startingValues = [3, 4, 5, 6, 7, 8]; // three of these are picked at random, turned into buttons
            for (let i = 0; i < 3; i++) {
                let randIndex = Math.floor(Math.random() * startingValues.length);
                let pickStrength = startingValues[randIndex];
                startingValues.splice(randIndex, 1); // remove selected value to avoid duplicates
                let newPick = new lockPick(pickStrength);
                picksPouch.push(newPick);

                let pickBtn = document.createElement("button");
                pickBtn.className = "pickButton";
                pickBtn.innerText = `Pick Strength: ${pickStrength}`;
                pickBtn.addEventListener("click", () => {
                    newPick.toggleSelect();
                    console.log(`Pick of strength ${pickStrength} selected: ${newPick.selected}`);
                });
                newPick.pickButton = pickBtn;
                pickContainer.appendChild(pickBtn);
            }
        }
        makePicks();
    </script>
</body>

</html>
